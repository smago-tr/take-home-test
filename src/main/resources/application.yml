server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:takehome}
    username: ${DB_USER:takehome}
    password: ${DB_PASSWORD:takehome}
  flyway:
    locations: classpath:db/migration

retry:
  api-key: ${RETRY_API_KEY:dev-only-retry-key-change-me}
