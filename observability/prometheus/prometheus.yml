global:
  scrape_interval: 5s

scrape_configs:
  - job_name: take-home-app
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal resolves to the host machine from inside the container — the app
      # runs via `./gradlew bootRun` on the host, not as another docker-compose service.
      - targets: ["host.docker.internal:8080"]
